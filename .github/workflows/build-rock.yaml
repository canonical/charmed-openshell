name: Build rock

on:
  push:
    branches:
      - main
    paths:
      - rocks/openshell-gateway/**
      - .github/workflows/build-rock.yaml
  pull_request:
    paths:
      - rocks/openshell-gateway/**
      - .github/workflows/build-rock.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pack (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Pack rock
        uses: canonical/craft-actions/rockcraft-pack@adff67a3dc8de1b95de1d25728bf83506ab701b2
        with:
          path: rocks/openshell-gateway

      - name: Run smoke tests
        run: rocks/openshell-gateway/tests/smoke.sh
        env:
          ROCK_DIR: rocks/openshell-gateway

      - name: Upload rock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rock-${{ matrix.arch }}
          path: rocks/openshell-gateway/*.rock
          if-no-files-found: error

  manifest:
    name: Assemble multi-arch manifest
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download amd64 rock
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rock-amd64
          path: dist/amd64

      - name: Download arm64 rock
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rock-arm64
          path: dist/arm64

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push arch-specific images and assemble manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/openshell-gateway"
          SHA="${{ github.sha }}"

          AMD64_ROCK=$(ls dist/amd64/*.rock | head -1)
          ARM64_ROCK=$(ls dist/arm64/*.rock | head -1)

          skopeo copy \
            "oci-archive:${AMD64_ROCK}" \
            "docker://${IMAGE}:${SHA}-amd64"

          skopeo copy \
            "oci-archive:${ARM64_ROCK}" \
            "docker://${IMAGE}:${SHA}-arm64"

          docker manifest create "${IMAGE}:${SHA}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"

          docker manifest push "${IMAGE}:${SHA}"

      - name: Verify multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/openshell-gateway"
          SHA="${{ github.sha }}"
          MANIFEST=$(docker manifest inspect "${IMAGE}:${SHA}")
          echo "$MANIFEST" | grep -q '"architecture":"amd64"' \
            || (echo "ERROR: amd64 missing from manifest" && exit 1)
          echo "$MANIFEST" | grep -q '"architecture":"arm64"' \
            || (echo "ERROR: arm64 missing from manifest" && exit 1)
          echo "Multi-arch manifest OK: both linux/amd64 and linux/arm64 present."
