name: CI (charm)

on:
  pull_request:
    paths:
      - charms/openshell-gateway-k8s/**
      - concierge.yaml
      - .github/workflows/ci-charm.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run lint
        run: |
          tox -e lint
        working-directory: charms/openshell-gateway-k8s

  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run unit tests
        run: |
          tox -e unit
        working-directory: charms/openshell-gateway-k8s

  static:
    name: Static type checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run static checks
        run: |
          tox -e static
        working-directory: charms/openshell-gateway-k8s

  build-charm:
    name: Build charm
    runs-on: ubuntu-24.04
    needs: [lint, unit, static]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pack charm
        uses: canonical/craft-actions/charmcraft/pack@39a1fa1fd30fb8bef5abb80a24f3a06ad6261d17
        with:
          path: charms/openshell-gateway-k8s

      - name: Upload charm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm
          path: charms/openshell-gateway-k8s/*.charm
          if-no-files-found: error

  integration-suite:
    name: Integration test suite (${{ matrix.suite }})
    needs: [build-charm]
    runs-on: [self-hosted-linux-amd64-noble-large]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test_charm.py
          - test_lxd_integrator.py
          - test_lxd_offer.py
          - test_observability.py
          - test_vault.py
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free up disk space
        timeout-minutes: 10
        run: |
          sudo rm -rf \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft/powershell \
            /opt/microsoft/msedge \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/lib/firefox \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/gradle* \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift \
            /home/linuxbrew
          printf '\nDisk usage\n'
          df --human-readable

      - name: Install concierge
        run: sudo snap install --classic concierge

      - name: Bootstrap Juju/K8s environment
        run: sudo concierge prepare -c concierge.yaml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install just and tox
        run: sudo apt install -y just tox

      - name: Install OpenShell client
        run: sudo snap install openshell

      - name: Download charm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          name: charm
          path: artifacts/charm

      - name: Resolve artifact paths
        id: artifacts
        run: |
          charm="$(realpath artifacts/charm/*.charm | head -n1)"
          echo "charm=$charm" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run integration tests
        run: just integration-test-charm tests/integration/${{ matrix.suite }}
        env:
          CHARM_FILE: ${{ steps.artifacts.outputs.charm }}

  integration:
    name: Integration tests
    needs: [integration-suite]
    runs-on: ubuntu-26.04
    steps:
      - name: Confirm test success
        run: echo "All integration test suites passed successfully."
