name: CI (charm)

on:
  pull_request:
    paths:
      - charms/openshell-gateway-k8s/**
      - concierge.yaml
      - .github/workflows/ci-charm.yaml
      - .github/actions/setup-microcloud/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENSHELL_SNAP_REVISION: "1041"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run lint
        run: |
          tox -e lint
        working-directory: charms/openshell-gateway-k8s

  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run unit tests
        run: |
          tox -e unit
        working-directory: charms/openshell-gateway-k8s

  static:
    name: Static type checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run static checks
        run: |
          tox -e static
        working-directory: charms/openshell-gateway-k8s

  build-charm:
    name: Build charm
    runs-on: ubuntu-24.04
    needs: [lint, unit, static]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pack charm
        uses: canonical/craft-actions/charmcraft/pack@39a1fa1fd30fb8bef5abb80a24f3a06ad6261d17
        with:
          path: charms/openshell-gateway-k8s

      - name: Upload charm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm
          path: charms/openshell-gateway-k8s/*.charm
          if-no-files-found: error

  integration-suite:
    name: Integration test suite (${{ matrix.suite.name }})
    needs: [build-charm]
    runs-on: [self-hosted-linux-amd64-noble-large]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The integrator suite creates sandboxes, which need OVN; it runs on
        # MicroCloud in its own job below.
        suite:
          - name: offer
            args: -m offer
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free up disk space
        timeout-minutes: 10
        run: |
          sudo rm -rf \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft/powershell \
            /opt/microsoft/msedge \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/lib/firefox \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/gradle* \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift \
            /home/linuxbrew
          printf '\nDisk usage\n'
          df --human-readable

      - name: Install concierge
        run: sudo snap install --classic concierge

      - name: Bootstrap Juju/K8s environment
        run: sudo concierge prepare -c concierge.yaml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install just and tox
        run: sudo apt install -y just tox

      # The CLI has to match the gateway rock's OpenShell release (0.0.116,
      # snap revision 1041); latest/stable has moved on to 0.1.x, which
      # cannot decode this gateway's responses. concierge installs the snap
      # from its channel first, so move it to the revision and hold it.
      - name: Install OpenShell client
        run: |
          if snap list openshell >/dev/null 2>&1; then
            sudo snap refresh openshell --revision="$OPENSHELL_SNAP_REVISION"
          else
            sudo snap install openshell --revision="$OPENSHELL_SNAP_REVISION"
          fi
          sudo snap refresh --hold openshell

      - name: Download charm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          name: charm
          path: artifacts/charm

      - name: Resolve artifact paths
        id: artifacts
        run: |
          charm="$(realpath artifacts/charm/*.charm | head -n1)"
          echo "charm=$charm" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run integration tests
        run: just integration-test-charm ${{ matrix.suite.args }}
        env:
          CHARM_FILE: ${{ steps.artifacts.outputs.charm }}
          OPENSHELL_ENABLE_SANDBOX_E2E: "true"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ matrix.suite.name }}
          path: artifacts/diagnostics/
          if-no-files-found: ignore

  # The integrator suite creates sandboxes, and the driver refuses to create
  # one off an OVN network (restrict-sandbox-egress puts every sandbox NIC
  # behind a network ACL). So the runner becomes a single-member MicroCloud,
  # Kubernetes and the Juju controllers run in a VM on its OVN network, and
  # the suite runs inside that VM with the VM's lxc client pointed at the
  # MicroCloud. Sandboxes land on the same OVN network as the VM, where the
  # load-balancer addresses the gateway is published on are routed to it.
  integration-integrator:
    name: Integration test suite (integrator, MicroCloud)
    needs: [build-charm]
    runs-on: [self-hosted-linux-amd64-noble-large]
    timeout-minutes: 120
    env:
      VM_NAME: openshell-charm-it
      VM_CPU: "8"
      VM_MEMORY: 16GiB
      VM_DISK: 80GiB
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free up disk space
        timeout-minutes: 10
        run: |
          sudo rm -rf \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft/powershell \
            /opt/microsoft/msedge \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/lib/firefox \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/gradle* \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift \
            /home/linuxbrew
          printf '\nDisk usage\n'
          df --human-readable

      - name: Download charm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          name: charm
          path: artifacts/charm

      - name: Set up MicroCloud
        uses: ./.github/actions/setup-microcloud
        with:
          disk-size: 100G

      - name: Launch the Kubernetes VM
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo lxc launch ubuntu:24.04 "$VM_NAME" --vm \
            -c limits.cpu="$VM_CPU" \
            -c limits.memory="$VM_MEMORY" \
            -d root,size="$VM_DISK"
          # lxc exec fails until the guest agent answers; retry through it.
          for _ in $(seq 60); do
            sudo lxc exec "$VM_NAME" -- true 2>/dev/null && break
            sleep 5
          done
          sudo lxc exec "$VM_NAME" -- cloud-init status --wait

      # The load-balancer pool is a strict top slice of the VM's own subnet,
      # so the sandboxes, on the same network, reach every announced address.
      # OVN port security drops traffic for addresses a NIC does not own, so
      # the pool is routed to the VM's NIC.
      - name: Route the load-balancer pool to the VM
        run: |
          set -euo pipefail
          vm_cidr="$(sudo lxc query "/1.0/instances/${VM_NAME}/state" | jq -r '
            .network | to_entries[] | select(.key != "lo") | .value.addresses[]
            | select(.family == "inet" and .scope == "global")
            | "\(.address)/\(.netmask)"' | head -1)"
          test -n "$vm_cidr"
          lb_cidr="$(python3 - <<'PY' "$vm_cidr"
          import ipaddress
          import sys

          net = ipaddress.ip_interface(sys.argv[1]).network
          lb_prefix = 28 if net.prefixlen < 28 else net.prefixlen + 1
          if lb_prefix > 30:
              raise SystemExit(f"{net} is too small for a distinct load-balancer pool")

          subnet_size = 1 << (32 - lb_prefix)
          base = int(net.broadcast_address) - subnet_size + 1
          lb_net = ipaddress.ip_network((base, lb_prefix))
          if lb_net == net or not lb_net.subnet_of(net):
              raise SystemExit(f"{lb_net} is not a strict subrange of {net}")

          print(lb_net.with_prefixlen)
          PY
          )"
          sudo lxc config device override "$VM_NAME" eth0 ipv4.routes="$lb_cidr"
          echo "LB_CIDR=${lb_cidr}" >> "$GITHUB_ENV"

      # The confined juju snap reads neither /root nor files outside the
      # user's home, so everything in the VM runs as its ubuntu user, the
      # way it runs as the runner's user on a plain runner.
      - name: Push the checkout and the charm into the VM
        run: |
          set -euo pipefail
          sudo lxc exec "$VM_NAME" -- sudo -u ubuntu mkdir -p /home/ubuntu/charmed-openshell
          sudo tar -C "$GITHUB_WORKSPACE" -cf - . \
            | sudo lxc exec "$VM_NAME" -- sudo -u ubuntu tar -xf - -C /home/ubuntu/charmed-openshell

      - name: Prepare the VM with concierge
        timeout-minutes: 45
        run: |
          sudo lxc exec "$VM_NAME" -- sudo -iu ubuntu \
            env LB_CIDR="$LB_CIDR" OPENSHELL_SNAP_REVISION="$OPENSHELL_SNAP_REVISION" bash -s <<'SCRIPT'
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq just tox
          sudo snap install --classic concierge
          cd ~/charmed-openshell
          sed "s|cidrs: \"[^\"]*\"|cidrs: \"${LB_CIDR}\"|" concierge.yaml > /tmp/concierge-vm.yaml
          sudo concierge prepare -c /tmp/concierge-vm.yaml
          # concierge installs the openshell snap from latest/stable, which
          # has moved past the gateway rock's release; pin the matching CLI
          # (0.0.116, revision 1041) and hold it.
          sudo snap refresh openshell --revision="$OPENSHELL_SNAP_REVISION"
          sudo snap refresh --hold openshell
          SCRIPT

      # The fixtures drive "the host LXD" with lxc; inside the VM that has
      # to be the MicroCloud, so it becomes the default remote. concierge's
      # own LXD in the VM stays reachable as local: for its Juju controller.
      - name: Point the VM's lxc client at the MicroCloud
        run: |
          set -euo pipefail
          token="$(sudo lxc config trust add --name "$VM_NAME" --quiet)"
          sudo lxc exec "$VM_NAME" -- sudo -iu ubuntu \
            lxc remote add microcloud "https://${MICROCLOUD_INTERNAL_ADDR}:8443" --token "$token"
          sudo lxc exec "$VM_NAME" -- sudo -iu ubuntu lxc remote switch microcloud
          sudo lxc exec "$VM_NAME" -- sudo -iu ubuntu lxc query /1.0 >/dev/null

      - name: Run integration tests
        run: |
          charm="$(basename "$(realpath artifacts/charm/*.charm | head -n1)")"
          sudo lxc exec "$VM_NAME" -- sudo -iu ubuntu \
            env CHARM_FILE="/home/ubuntu/charmed-openshell/artifacts/charm/${charm}" \
                OPENSHELL_TEST_LXD_ADDRESS="${MICROCLOUD_INTERNAL_ADDR}:8443" \
                OPENSHELL_ENABLE_SANDBOX_E2E=true \
            bash -c 'cd ~/charmed-openshell && just integration-test-charm -m integrator -rs'

      - name: Collect diagnostics
        if: failure()
        run: |
          sudo install -d -m 0755 "$GITHUB_WORKSPACE/artifacts/diagnostics"
          if sudo lxc exec "$VM_NAME" -- test -d /home/ubuntu/charmed-openshell/artifacts/diagnostics; then
            sudo lxc file pull -r "$VM_NAME/home/ubuntu/charmed-openshell/artifacts/diagnostics" \
              "$GITHUB_WORKSPACE/artifacts/" || true
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-integrator
          path: artifacts/diagnostics/
          if-no-files-found: ignore

      # Leave the runner the way the concierge-based jobs need it: no
      # MicroCloud, LXD installed but uninitialized.
      - name: Tear down
        if: always()
        timeout-minutes: 25
        run: |
          sudo lxc delete --force "$VM_NAME" || true
          sudo losetup -d "${MICROCLOUD_DISK:-}" 2>/dev/null || true
          sudo rm -rf /var/microcloud /tmp/microcloud-preseed.yaml
          sudo snap remove --purge microcloud microceph microovn || true
          sudo snap remove --purge lxd || true
          sudo snap install lxd --channel=6/stable --cohort="+"
          sudo snap refresh --unhold lxd
          sudo lxd waitready --timeout=120

  integration:
    name: Integration tests
    needs: [integration-suite, integration-integrator]
    runs-on: ubuntu-26.04
    steps:
      - name: Confirm test success
        run: echo "All integration test suites passed successfully."
