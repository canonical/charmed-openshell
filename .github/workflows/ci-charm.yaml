name: CI (charm)

on:
  push:
    branches:
      - main
    paths:
      - charms/openshell-gateway-k8s/**
      - charms/lxd-integrator-k8s/**
      - rocks/openshell-gateway/**
      - concierge.yaml
      - .github/workflows/ci-charm.yaml
  pull_request:
    paths:
      - charms/openshell-gateway-k8s/**
      - charms/lxd-integrator-k8s/**
      - rocks/openshell-gateway/**
      - concierge.yaml
      - .github/workflows/ci-charm.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run lint
        run: |
          tox -e lint
        working-directory: charms/openshell-gateway-k8s

  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run unit tests
        run: |
          tox -e unit
        working-directory: charms/openshell-gateway-k8s

  static:
    name: Static type checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt install -y tox
      - name: Run static checks
        run: |
          tox -e static
        working-directory: charms/openshell-gateway-k8s

  build-charm:
    name: Build charm
    runs-on: ubuntu-24.04
    needs: [lint, unit, static]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pack charm
        uses: canonical/craft-actions/charmcraft/pack@39a1fa1fd30fb8bef5abb80a24f3a06ad6261d17
        with:
          path: charms/openshell-gateway-k8s

      - name: Upload charm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charm
          path: charms/openshell-gateway-k8s/*.charm
          if-no-files-found: error

  build-rock:
    name: Build rock
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pack rock
        uses: canonical/craft-actions/rockcraft/pack@39a1fa1fd30fb8bef5abb80a24f3a06ad6261d17
        with:
          path: rocks/openshell-gateway

      - name: Upload rock artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rock
          path: rocks/openshell-gateway/*.rock
          if-no-files-found: error

  integration:
    name: Integration tests
    needs: [build-charm, build-rock]
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free up disk space
        timeout-minutes: 10
        run: |
          sudo rm -rf \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft/powershell \
            /opt/microsoft/msedge \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/lib/firefox \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/gradle* \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift \
            /home/linuxbrew
          printf '\nDisk usage\n'
          df --human-readable

      - name: Install concierge
        run: sudo snap install --classic concierge

      - name: Bootstrap Juju/K8s environment
        run: sudo concierge prepare -c concierge.yaml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install just and tox
        run: sudo apt install -y just tox

      - name: Install OpenShell client
        run: sudo snap install openshell

      - name: Download charm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          name: charm
          path: artifacts/charm

      - name: Download rock artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          name: rock
          path: artifacts/rock

      - name: Resolve artifact paths
        id: artifacts
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) rock_arch="amd64" ;;
            aarch64) rock_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          charm="$(realpath artifacts/charm/*.charm | head -n1)"
          rock="$(realpath artifacts/rock/*_${rock_arch}.rock | head -n1)"
          echo "charm=$charm" >> "$GITHUB_OUTPUT"
          echo "rock=$rock" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        run: just integration-test-charm
        env:
          CHARM_FILE: ${{ steps.artifacts.outputs.charm }}
          ROCK_FILE: ${{ steps.artifacts.outputs.rock }}
