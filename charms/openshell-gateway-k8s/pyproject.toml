[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--tb=short"
pythonpath = ["src", "lib"]
markers = [
    "lxd: tests that need the gateway joined to an LXD with a trust token",
    "observability: tests for the opentelemetry-collector-k8s metrics path",
    "vault: tests for the vault-k8s credentials store",
    "scale: tests for multi-unit scale and rolling operations",
    "stack: tests for the composed terraform/openshell-stack deployment",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["lib"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "C4", "SIM"]
ignore = ["E501"]
