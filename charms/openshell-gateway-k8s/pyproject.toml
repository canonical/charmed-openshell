[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--tb=short"
pythonpath = ["src", "lib"]
markers = [
    "integrator: tests for the lxd-integrator-k8s provider path",
    "offer: tests for the cross-model lxd charm offer provider path",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["lib"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "C4", "SIM"]
ignore = ["E501"]
