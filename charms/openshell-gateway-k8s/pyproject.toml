[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--tb=short"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "C4", "SIM"]
ignore = ["E501"]
