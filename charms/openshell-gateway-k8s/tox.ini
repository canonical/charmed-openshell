[tox]
min_version = 4
env_list = lint, unit

[testenv:fmt]
description = Fix formatting with ruff
deps =
    ruff
commands =
    ruff format src/ tests/
    ruff check --fix src/ tests/

[testenv:lint]
description = Run ruff linter and formatter checks
deps =
    ruff
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:unit]
description = Run unit tests with coverage
deps =
    pytest
    pytest-cov
    ops[testing] >= 3, < 4
    pydantic >= 2, < 3
    cryptography
    jsonschema
    charmlibs-rollingops >= 1.1, < 2
    cosl >= 0.0.53
    hvac >= 2, < 3
    pytest-interface-tester
    jubilant
commands =
    pytest -v --tb=short --cov=src --cov-report=term-missing {posargs:tests/unit}

[testenv:static]
description = Static type checking (optional)
deps =
    pyright
    ops >= 3, < 4
    pydantic >= 2, < 3
    cryptography
    charmlibs-rollingops >= 1.1, < 2
    cosl >= 0.0.53
    hvac >= 2, < 3
    pytest-interface-tester
commands =
    pyright src/

[testenv:integration]
description = Integration tests against a live Juju/microk8s (Jubilant)
deps =
    pytest
    pytest-timeout
    jubilant
    cryptography
passenv =
    CHARM_FILE
    INTEGRATOR_CHARM_FILE
    INTEGRATOR_CHARM_DIR
    INTEGRATOR_CHARM_REPO
    INTEGRATOR_CHARM_REF
    GATEWAY_IMAGE
    OPENSHELL_ENABLE_SANDBOX_E2E
    OPENSHELL_DISABLE_SANDBOX_E2E
    OPENSHELL_TEST_LXD_ADDRESS
    OPENSHELL_TEST_LXD_PROJECT
    JUJU_MODEL
    JUJU_CONTROLLER
    JUJU_LXD_CONTROLLER
    STACK_IDENTITY_HOSTNAME
    STACK_EXTERNAL_HOSTNAME
    STACK_LXD_ENDPOINT
    STACK_LXD_CLIENT_CERT
    STACK_LXD_CLIENT_KEY
    STACK_LXD_SERVER_CERT
    STACK_LXD_PROJECT
    STACK_OPENSHELL_MODEL
    STACK_TF_DIR
    STACK_VARS_FILE
commands =
    pytest -v --tb=short -o testpaths=tests/integration -o addopts= {posargs:tests/integration}
