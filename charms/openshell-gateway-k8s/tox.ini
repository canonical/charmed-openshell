[tox]
min_version = 4
env_list = lint, unit

[testenv:fmt]
description = Fix formatting with ruff
deps =
    ruff
commands =
    ruff format src/ tests/
    ruff check --fix src/ tests/

[testenv:lint]
description = Run ruff linter and formatter checks
deps =
    ruff
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:unit]
description = Run unit tests with coverage
deps =
    pytest
    pytest-cov
    ops[testing] >= 2.1, < 3
    pydantic >= 2, < 3
    cryptography
    jsonschema
commands =
    pytest -v --tb=short --cov=src --cov-report=term-missing {posargs:tests/unit}

[testenv:static]
description = Static type checking (optional)
deps =
    pyright
    ops >= 2.1, < 3
    pydantic >= 2, < 3
    cryptography
commands =
    pyright src/

[testenv:integration]
description = Integration tests against a live Juju/microk8s (Jubilant)
deps =
    pytest
    jubilant
    cryptography
passenv =
    CHARM_FILE
    INTEGRATOR_CHARM_FILE
    GATEWAY_IMAGE
    ROCK_FILE
    LOCAL_REGISTRY
    JUJU_MODEL
    JUJU_CONTROLLER
    JUJU_LXD_CONTROLLER
commands =
    pytest -v --tb=short -o testpaths=tests/integration -o addopts= {posargs:tests/integration}
