[tox]
min_version = 4
env_list = lint, unit, static

[testenv:fmt]
description = Fix formatting with ruff
deps =
    ruff
commands =
    ruff format src/ tests/
    ruff check --fix src/ tests/

[testenv:lint]
description = Run ruff linter and formatter checks
deps =
    ruff
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:unit]
description = Run unit tests with coverage
deps =
    pytest
    pytest-cov
    ops[testing] >= 2.1, < 3
    pydantic >= 2, < 3
    cryptography
    pyyaml
commands =
    pytest -v --tb=short --cov=src --cov-report=term-missing {posargs:tests/unit}

[testenv:static]
description = Static type checking
deps =
    pyright
    ops >= 2.1, < 3
    pydantic >= 2, < 3
    cryptography
commands =
    pyright src/
